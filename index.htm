
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الأسطورة ساندي</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 background:radial-gradient(circle,#780000,#160000 75%);
 color:white;
 font-family:Tahoma;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
}
.container{
 width:100%;
 max-width:460px;
 background:#240000;
 border:2px solid red;
 border-radius:20px;
 padding:25px;
 text-align:center;
 box-shadow:0 0 15px red,0 0 35px #900;
}
.logo{
 font-size:32px;
 font-weight:bold;
 animation:glow 1.3s infinite;
}
@keyframes glow{
 0%,100%{opacity:1;text-shadow:0 0 15px white,0 0 25px red}
 50%{opacity:.3;text-shadow:none}
}
.subtitle{color:#ffbaba;margin:20px}
.btn{
 display:block;
 width:100%;
 padding:16px;
 margin:15px 0;
 border:2px solid white;
 border-radius:12px;
 background:#a00000;
 color:white;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
 animation:blink 1.5s infinite;
}
@keyframes blink{
 0%,100%{box-shadow:0 0 15px red,0 0 5px white}
 50%{box-shadow:none}
}
input[type=file]{display:none}
#preview{
 display:none;
 max-width:100%;
 max-height:250px;
 margin:15px auto;
 border:2px solid white;
 border-radius:12px;
}
#status{color:#fff;margin:15px}
#result{
 display:none;
 background:#400000;
 padding:15px;
 border-radius:10px;
 overflow-wrap:anywhere;
}
#result a{color:white}
.copy{
 padding:10px 20px;
 border:0;
 border-radius:8px;
 background:white;
 color:#900;
 cursor:pointer;
 margin-top:12px;
}
footer{margin-top:25px;font-size:13px;color:#ffbaba}
</style>
</head>

<body>
<div class="container">

<div class="logo">★ الأسطورة ساندي ★</div>
<div class="subtitle">مركز رفع الصور المباشر</div>

<label class="btn" for="photo">📷 اختيار صورة</label>
<input type="file" id="photo" accept="image/*">

<img id="preview">

<button class="btn" onclick="uploadImage()">
⬆ رفع الصورة الآن
</button>

<div id="status">أهلاً بك في مركز ساندي</div>

<div id="result">
تم رفع الصورة بنجاح ✓
<br><br>
<a id="imageLink" target="_blank"></a>
<br>
<button class="copy" onclick="copyLink()">نسخ الرابط</button>
</div>

<footer>© جميع الحقوق محفوظة للأسطورة ساندي</footer>
</div>

<script>
const API_KEY = "5a5e2c66ecb37cd7f5099f7fa7209ff4";

const photo = document.getElementById("photo");

photo.addEventListener("change",function(){
 const file=this.files[0];
 if(!file)return;

 if(!file.type.startsWith("image/")){
 alert("اختر ملف صورة فقط");
 return;
 }

 document.getElementById("preview").src=
 URL.createObjectURL(file);

 document.getElementById("preview").style.display="block";
 document.getElementById("status").innerText="تم اختيار الصورة";
});

async function uploadImage(){
 const file=photo.files[0];

 if(!file){
 alert("يرجى اختيار صورة أولاً");
 return;
 }

 if(API_KEY==="Ab8RN6IJoffqqtbsuBpvV2eV8ShwdbNFcQ0Wsg9A082bq2EuZA"){
 document.getElementById("status").innerText=
 "أضف مفتاح API لتفعيل الرفع";
 return;
 }

 const data=new FormData();
 data.append("image",file);

 document.getElementById("status").innerText="جاري رفع الصورة...";

 try{
 const response=await fetch(
 "https://api.imgbb.com/1/upload?key="+encodeURIComponent(API_KEY),
 {method:"POST",body:data}
 );

 const result=await response.json();

 if(!response.ok || !result.success){
 throw new Error(result.error?.message || "فشل الرفع");
 }

 const url=result.data.url;

 document.getElementById("imageLink").href=url;
 document.getElementById("imageLink").innerText=url;
 document.getElementById("result").style.display="block";
 document.getElementById("status").innerText="تم الرفع بنجاح ✓";

 }catch(error){
 document.getElementById("status").innerText="فشل الرفع: "+error.message;
 }
}

function copyLink(){
 const url=document.getElementById("imageLink").href;
 navigator.clipboard.writeText(url)
 .then(()=>alert("تم نسخ الرابط"))
 .catch(()=>alert("تعذر النسخ"));
}
</script>
</body>
</html>
